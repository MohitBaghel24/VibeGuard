name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # We set the default directory to vibeguard-cli since that's where the code lives
    defaults:
      run:
        working-directory: ./vibeguard-cli

    steps:
    # 1. Check out the code from the repository
    - uses: actions/checkout@v4
    
    # 2. Set up Node.js
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './vibeguard-cli/package-lock.json'
        
    # 3. Install dependencies exactly as they are in package-lock.json
    - name: Install dependencies
      run: npm ci
      
    # 4. Check for TypeScript errors
    - name: Run Typecheck
      run: npm run typecheck
      
    # 5. Check for code style/linting errors
    - name: Run Linter
      run: npm run lint
      
    # 6. Run Vitest test suite
    - name: Run Tests
      run: npm run test
      
    # 7. Ensure the project builds successfully
    - name: Build Project
      run: npm run build

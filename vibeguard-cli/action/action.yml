name: 'VibeGuard Scan'
description: 'Scan your code for security issues generated by AI coding assistants'
author: 'VibeGuard'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  fail-below:
    description: 'Fail if score drops below this threshold (0-100)'
    required: false
  severity:
    description: 'Minimum severity to report (low, medium, high, critical)'
    required: false
  output-format:
    description: 'Output format (text, json, sarif)'
    required: false
    default: 'text'

runs:
  using: 'composite'
  steps:
    - name: Run VibeGuard
      run: |
        ARGS="${{ inputs.path }} -o ${{ inputs.output-format }}"
        if [ -n "${{ inputs.fail-below }}" ]; then
          ARGS="$ARGS -f ${{ inputs.fail-below }}"
        fi
        if [ -n "${{ inputs.severity }}" ]; then
          ARGS="$ARGS -s ${{ inputs.severity }}"
        fi
        npx vibeguard-scan scan $ARGS
      shell: bash
